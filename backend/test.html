<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ExploreBD Upload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { background: #f4f4f4; padding: 20px; border-radius: 8px; max-width: 400px; }
        input { margin-bottom: 15px; display: block; width: 100%; }
        button { padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Test Guide Verification Upload</h2>
    
    <!-- Notice the enctype="multipart/form-data" - this is required for files! -->
    <form action="http://localhost:5052/api/verification/submit" method="POST" enctype="multipart/form-data">
        
        <label>University Name:</label>
        <input type="text" name="universityName" value="BRAC University" required>

        <label>Student ID Number:</label>
        <input type="text" name="studentIdNumber" value="22201492" required>

        <label>NID/Passport Number:</label>
        <input type="text" name="nidOrPassportNumber" value="1234567890" required>

        <label>Student ID Image:</label>
        <!-- The name attribute MUST match what Multer expects in your route -->
        <input type="file" name="studentIdCard" required>

        <label>NID/Passport Image:</label>
        <input type="file" name="nidOrPassport" required>

        <button type="submit">Submit Documents</button>
    </form>

</body>
</html>
